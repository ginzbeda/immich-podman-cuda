name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      # Mount order matters: a nested mount must follow the mount it sits in.
      # 1. UPLOAD ROOT (SSD) — thumbs and in-flight uploads.
      # Small files read constantly while browsing.
      - ${HOST_MEDIA_LOCATION}:/usr/src/app/upload

      # 2. MANAGED LIBRARY (HDD) — mounted over the upload root's library/
      # subdirectory so originals land on bulk storage.
      - ${HOST_LIBRARY_LOCATION}:/usr/src/app/upload/library

      # 3. BULK IMMICH DATA (HDD) — large or cold, mounted over the SSD root.
      # NOTE: encoded-video/ holds motion-photo companion videos that are the
      # ONLY copy of that data, not just regenerable transcodes.
      - ${HOST_BULK_LOCATION}/encoded-video:/usr/src/app/upload/encoded-video
      - ${HOST_BULK_LOCATION}/backups:/usr/src/app/upload/backups
      - ${HOST_BULK_LOCATION}/profile:/usr/src/app/upload/profile

      # 4. EXTERNAL LIBRARY SOURCE (HDD, read-only) — the curated folder tree.
      # Immich indexes these in place and never writes here.
      - ${HOST_IMPORT_LOCATION}:/usr/src/app/external:ro
      # TEMPORARY — Photos/ could not be moved into the import tree (open
      # Windows handle). Mounted into place so restored paths resolve. See .env.
      - ${HOST_IMPORT_PHOTOS_LOCATION}:/usr/src/app/external/Photos:ro

      - /etc/localtime:/etc/localtime:ro
    env_file: [.env]
    ports:
      - 127.0.0.1:2283:2283
    devices:
      - nvidia.com/gpu=all
    environment:
      - IMMICH_HOST=${IMMICH_HOST}
    depends_on:
      - redis
      - database
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    # Using the CUDA-specific image for hardware-accelerated processing
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-cuda
    volumes:
      - model-cache:/cache
    env_file: [.env]
    devices:
      - nvidia.com/gpu=all
    environment:
      - IMMICH_MACHINE_LEARNING_DEVICE=${IMMICH_MACHINE_LEARNING_DEVICE}
    restart: always

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    volumes:
      - ${HOST_MEDIA_LOCATION}/redis:/data
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    env_file: [.env]
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # We use a named volume to bypass NTFS permission issues
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always

volumes:
  model-cache:
  pgdata: